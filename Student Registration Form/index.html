<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>

        <form id="registrationForm">

            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName">
            </div>

            <div class="form-group">
                <label>Gender:</label>

                <div class="options">
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Qualification:</label>

                <div class="options">
                    <input type="checkbox" id="undergraduate" name="qualification" value="Under Graduate">
                    <label for="undergraduate">Under Graduate</label>

                    <input type="checkbox" id="graduate" name="qualification" value="Graduate">
                    <label for="graduate">Graduate</label>

                    <input type="checkbox" id="postgraduate" name="qualification" value="Post Graduate">
                    <label for="postgraduate">Post Graduate</label>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="country">Country:</label>

                <select id="country" name="country">
                    <option value="">Select Country</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input type="tel" id="mobile" name="mobile" maxlength="10">
            </div>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset" id="resetButton">Reset</button>
            </div>

        </form>

        <div id="message"></div>

    </div>
<script src="script.js" defer></script>

</body>
</html>
